apis:
- aid: zippin:zippin-gateway
  name: Zippin Gateway
  description: 'The Zippin Gateway is Zippin''s integration/API framework for its checkout-free store
    platform — the surface retailers and partners use to connect payment gateways, loyalty and gift providers,
    campus card systems, inventory systems and POS to a Zippin store, and to pull order, cart and reporting
    data. Zippin''s own retailer documentation describes it as "a standard rest API with a nested JSON
    payload" that a retailer team can call either for a given date or for change transactions since a
    point in time. No public API reference, OpenAPI description or developer portal is published: the
    live host at https://api.getzippin.com answers every /v1/* request with an HTTP 401 authentication_error,
    so the operation surface is reachable only by Zippin customers and integration partners.'
  image: https://www.getzippin.com/hs-fs/hubfs/zippinlogocolor-266x68.png
  humanURL: https://www.getzippin.com/zippin-technology
