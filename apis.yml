aid: zippin
name: Zippin
description: Zippin (vCognition Technologies Inc.) builds a checkout-free, cashierless retail platform
  that uses computer vision, sensor fusion and machine learning to let shoppers enter a store with an
  app, credit card or campus credential, take what they want and leave without a checkout line. The company
  sells store formats including the Zippin Retrofit, Zippin Lane, Zippin Walk-Up, Micromarket Lite and
  Zippin Outdoors, and operates in stadiums, arenas, airports, hotels, theme parks, college campuses and
  convenience retail. Its integration surface is the Zippin Gateway, an API framework the company says
  connects the platform to more than 25 third-party systems — payment gateways, loyalty and gift programs,
  campus card providers, inventory systems, POS and self-service beverage hardware — alongside a Store
  Dashboard whose Reports Dashboard data can also be pulled through a REST API with nested JSON payloads.
  Founded by veterans of Amazon and SRI, Zippin is headquartered in San Francisco.
