request_tracing:
  request_id_header: null
  observed_response_headers: [etag, vary, strict-transport-security, x-content-type-options,
    x-frame-options, referrer-policy, content-security-policy]
  note: 'The 401 response carries a hardening header set (Helmet-style) and a weak ETag, but
    no correlation/request-id header is exposed to an unauthenticated caller.'
webhooks:
  documented: false
  note: 'No webhook or event catalog is published. The help center describes the delta pull as
    "a push of unique data only", but does not document a subscription, callback URL or event
    schema, so no Webhooks pointer is emitted.'
